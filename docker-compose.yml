services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DB_PATH: /app/data/ibeku.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ibeku2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NODE_OPTIONS: "--max-old-space-size=256"
    volumes:
      - ibeku_sqlite:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ibeku_sqlite:
